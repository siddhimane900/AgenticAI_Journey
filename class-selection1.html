<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Class & Division</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    padding:20px;
}

.container{
    width:100%;
    max-width:600px;
}

.selection-box{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:40px;
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.selection-box h1{
    text-align:center;
    color:#38bdf8;
    margin-bottom:10px;
}

.selection-box p{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:30px;
}

.input-group{
    margin-bottom:25px;
}

.input-group label{
    display:block;
    margin-bottom:10px;
    font-weight:500;
}

select{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:10px;
    font-size:15px;
}

.division-section{
    margin-top:20px;
}

.division-title{
    margin-bottom:15px;
    font-weight:bold;
}

.division-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.division-card{
    background:rgba(255,255,255,0.12);
    padding:15px;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

.division-card:hover{
    background:#38bdf8;
}

.division-card input{
    margin-right:10px;
}

.continue-btn{
    width:100%;
    margin-top:30px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#38bdf8;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.continue-btn:hover{
    background:#0284c7;
}

</style>
</head>

<body>

<div class="container">

    <div class="selection-box">

        <h1>Select Class & Division</h1>
        <p>Choose Class and Division to Continue</p>

        <div class="input-group">

            <label>Select Class</label>

            <select>
                <option>-- Select Class --</option>
                <option>11th Science</option>
                <option>12th Science</option>
            </select>

        </div>

        <div class="division-section">

            <div class="division-title">
                Select Division
            </div>

            <div class="division-grid">

                <label class="division-card">
                    <input type="radio" name="division">
                    A Division
                </label>

                <label class="division-card">
                    <input type="radio" name="division">
                    B Division
                </label>

                <label class="division-card">
                    <input type="radio" name="division">
                    C Division
                </label>

                <label class="division-card">
                    <input type="radio" name="division">
                    D Division
                </label>

            </div>

        </div>

        
<button
class="continue-btn"
onclick="window.location.href='faculty-dashboard.html'">
Continue
</button>

    </div>

</div>

</body>
</html>
